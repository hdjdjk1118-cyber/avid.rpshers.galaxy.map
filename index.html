<!DOCTYPE html>
<html>
<head>
    <title>Технические работы</title>
    <style>
        body {
            background: #0a0a0f;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            margin: 0;
        }
        .message {
            border: 2px solid #ff4444;
            padding: 40px;
            border-radius: 10px;
            background: #1a1a2e;
        }
        h1 { color: #ff4444; }
        .emoji { font-size: 48px; }
    </style>
</head>
<body>
    <div class="message">
        <div class="emoji">🔧</div>
        <h1>Технические работы</h1>
        <p>Сайт временно недоступен.</p>
        <p>Ведутся обновления и улучшения.</p>
        <p>Вернёмся скоро!</p>
        <p style="color: #666; font-size: 14px; margin-top: 20px;">Спасибо за понимание</p>
    </div>
</body>
</html>
